# Issue #1280: This file documents ONLY the REST endpoints that
# server/src/http/routes.ts (and webhookRoutes.ts) actually serve.
# It was previously inflated with 51 Soroban contract function paths
# that 404'd in every real deployment.
#
# Source of truth: server/src/http/routes.ts
# CI drift check: .github/workflows/openapi-drift.yml
openapi: "3.0.3"
info:
  title: QuorumCredit Broadcast Server API
  description: |
    REST API served by the QuorumCredit broadcast/relay server
    (`server/src/index.ts`).

    This spec covers **only** the HTTP routes registered in
    `server/src/http/routes.ts` and `server/src/http/webhookRoutes.ts`.
    Soroban contract functions (vouch, request_loan, repay, etc.) are
    invoked via the Stellar RPC directly — they are not wrapped as REST
    endpoints here. See `docs/openapi.yaml` for the contract-function
    reference (RPC-style).
  version: "2.0.0"
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.quorumcredit.xyz
    description: Production

tags:
  - name: health
    description: Liveness and readiness probes
  - name: metrics
    description: Prometheus metrics scrape endpoint
  - name: auth
    description: API token issuance
  - name: graphql
    description: GraphQL queries with bounded complexity and list sizes
  - name: api-v1
    description: Tier-limited versioned API operations
  - name: expenses
    description: Loan expense tracking
  - name: recurring-payments
    description: Recurring repayment schedules
  - name: webhooks
    description: Webhook registration and management
  - name: forecast
    description: Loan repayment forecasting and accuracy tracking

paths:
  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [health]
      summary: Health check
      description: Returns `{ "status": "ok" }` when the server is running.
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ── Metrics ─────────────────────────────────────────────────────────────────
  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus metrics
      description: Exposes internal counters in Prometheus text format.
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string

  # ── Auth ────────────────────────────────────────────────────────────────────
  /api/auth/token:
    post:
      tags: [auth]
      summary: Issue a JWT
      description: |
        Exchange an API key for a short-lived JWT used to authenticate
        subsequent requests. In production you must replace the
        placeholder credential check with a real API-key store lookup.
      operationId: issueToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Missing or invalid apiKey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /graphql:
    post:
      tags: [graphql]
      summary: Execute a GraphQL query
      operationId: executeGraphqlQuery
      description: Queries credentials, verifications, verification statistics, and indexed events. Query complexity is limited to 100 and list arguments to 100.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphqlRequest"
      responses:
        "200":
          description: GraphQL query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphqlResponse"
        "400":
          description: Invalid or over-complex query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphqlResponse"
        "413":
          description: Request body exceeds 64 KiB
        "401":
          description: Missing or invalid bearer token
        "429":
          description: Tier quota exhausted

  /api/v1/limits:
    get:
      tags: [api-v1]
      summary: Get current API rate-limit usage
      operationId: getApiLimits
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current tier quota and window usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiLimitsResponse"
        "401":
          description: Missing or invalid bearer token
        "429":
          description: Tier quota exhausted

  /api/v1/retry-stats:
    get:
      tags: [api-v1]
      summary: Get retry statistics
      operationId: getRetryStatistics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Operation-level retry counts and accumulated delay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryStatsResponse"
        "401":
          description: Missing or invalid bearer token
        "429":
          description: Tier quota exhausted

  /api/v1/credentials/import/batch:
    post:
      tags: [api-v1]
      summary: Import a credential batch
      operationId: importCredentialBatch
      security:
        - BearerAuth: []
      description: Imports up to 500 credential records asynchronously. Invalid rows are reported individually. Expires-at values are Unix timestamps in seconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 500
              items:
                $ref: "#/components/schemas/CredentialImportItem"
          text/csv:
            schema:
              type: string
              description: CSV with holderId,type,issuer,expiresAt and optional metadata columns
      responses:
        "202":
          description: Import accepted; poll the returned importId for progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialImportBatch"
        "400":
          description: Invalid request body or CSV headers
        "401":
          description: Missing or invalid bearer token
        "413":
          description: Request exceeds 2 MiB or 500 rows
        "415":
          description: Unsupported content type
        "429":
          description: Tier quota exhausted

  /api/v1/credentials/import/{importId}:
    get:
      tags: [api-v1]
      summary: Get credential import progress
      operationId: getCredentialImport
      security:
        - BearerAuth: []
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Import status and per-row results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialImportBatch"
        "401":
          description: Missing or invalid bearer token
        "404":
          description: Import does not exist or belongs to another API identity
        "429":
          description: Tier quota exhausted

  # ── Loan Expenses ───────────────────────────────────────────────────────────
  /loans/{loanId}/expenses:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    post:
      tags: [expenses]
      summary: Record a loan expense
      operationId: addExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseRequest"
      responses:
        "201":
          description: Expense recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [expenses]
      summary: List expenses for a loan
      operationId: listExpenses
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"

  /loans/{loanId}/expense-breakdown:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    get:
      tags: [expenses]
      summary: Expense breakdown by category
      operationId: getExpenseBreakdown
      responses:
        "200":
          description: Category totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseBreakdown"

  # ── Recurring Payments ──────────────────────────────────────────────────────
  /loans/{loanId}/recurring-payment:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    post:
      tags: [recurring-payments]
      summary: Set up a recurring repayment schedule
      operationId: setupRecurringPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringPaymentRequest"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPaymentSchedule"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: [recurring-payments]
      summary: Get the recurring payment schedule for a loan
      operationId: getRecurringPayment
      responses:
        "200":
          description: Schedule details with success rate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPaymentSchedule"
        "404":
          description: No schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [recurring-payments]
      summary: Terminate a recurring payment schedule
      operationId: terminateRecurringPayment
      responses:
        "200":
          description: Schedule terminated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminateResponse"
        "404":
          description: No schedule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loans/{loanId}/recurring-payment/execute:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    post:
      tags: [recurring-payments]
      summary: Manually trigger a due recurring payment
      operationId: executeRecurringPayment
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringPaymentResult"
        "500":
          description: Unexpected execution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Webhooks ────────────────────────────────────────────────────────────────
  /api/webhooks/register:
    post:
      tags: [webhooks]
      summary: Register a new webhook endpoint
      operationId: registerWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWebhookRequest"
      responses:
        "201":
          description: Webhook registered — secret returned once only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRegistration"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/webhooks:
    get:
      tags: [webhooks]
      summary: List all registered webhooks (secrets redacted)
      operationId: listWebhooks
      responses:
        "200":
          description: Array of webhook registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookSummary"

  /api/webhooks/{webhookId}:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [webhooks]
      summary: Get a single webhook registration
      operationId: getWebhook
      responses:
        "200":
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [webhooks]
      summary: Update a webhook registration
      operationId: updateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebhookRequest"
      responses:
        "200":
          description: Updated webhook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSummary"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [webhooks]
      summary: Delete a webhook registration
      operationId: deleteWebhook
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/webhooks/{webhookId}/test:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    post:
      tags: [webhooks]
      summary: Send a test event to a registered webhook
      operationId: testWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestWebhookRequest"
      responses:
        "200":
          description: Test delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestWebhookResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/webhooks/{webhookId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [webhooks]
      summary: List delivery attempts for a webhook
      operationId: listWebhookDeliveries
      responses:
        "200":
          description: Array of delivery attempt records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookDeliveryAttempt"
        "404":
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/webhooks/{webhookId}/stats:
    parameters:
      - $ref: "#/components/parameters/WebhookId"
    get:
      tags: [webhooks]
      summary: Delivery success-rate statistics for a webhook
      operationId: getWebhookStats
      responses:
        "200":
          description: Delivery statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryStats"
        "404":
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /webhook:
    post:
      tags: [webhooks]
      summary: Receive an incoming signed webhook
      description: |
        Endpoint for receiving externally-posted webhook events.
        Validates the `X-Webhook-Signature` header against the configured
        `webhookSecret`.
      operationId: receiveWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookReceiveResponse"
        "401":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Forecast ─────────────────────────────────────────────────────────────────
  /loans/{loanId}/forecast:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    get:
      tags: [forecast]
      summary: Generate a repayment forecast for a loan
      description: |
        Returns a projected repayment schedule based on loan terms.
        Query params override the default terms derived from the loan id.
      operationId: getLoanForecast
      parameters:
        - in: query
          name: principal
          schema:
            type: number
            minimum: 0
          description: Loan principal in stroops
        - in: query
          name: interestRateBps
          schema:
            type: number
            minimum: 0
          description: Interest rate in basis points
        - in: query
          name: termDays
          schema:
            type: number
            minimum: 1
          description: Loan term in days
        - in: query
          name: paymentFrequencyDays
          schema:
            type: number
            minimum: 1
          description: Payment frequency in days
      responses:
        "200":
          description: Loan repayment forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanForecastResponse"
        "500":
          description: Forecast generation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loans/{loanId}/forecast/accuracy:
    parameters:
      - $ref: "#/components/parameters/LoanId"
    post:
      tags: [forecast]
      summary: Record an actual payment against a forecasted amount
      description: Tracks forecast accuracy over time by recording actual vs forecasted payments.
      operationId: recordForecastAccuracy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordForecastAccuracyRequest"
      responses:
        "201":
          description: Accuracy sample recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastAccuracyResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ── Components ──────────────────────────────────────────────────────────────
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: signed token
  parameters:
    LoanId:
      name: loanId
      in: path
      required: true
      description: Loan identifier (string)
      schema:
        type: string
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Webhook registration identifier
      schema:
        type: string

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error message describing what went wrong
      example:
        error: "Invalid API key"

    GraphqlRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        operationName:
          type: string
        variables:
          type: object
          additionalProperties: true

    GraphqlResponse:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
        errors:
          type: array
          items:
            type: object
            required: [message]
            properties:
              message:
                type: string

    ApiLimitsResponse:
      type: object
      required: [tier, limit, used, remaining, resetAt, windowMs]
      properties:
        tier:
          type: string
          enum: [free, pro, enterprise]
        limit:
          type: integer
        used:
          type: integer
          description: Requests already consumed in the current rate-limit window
        remaining:
          type: integer
        resetAt:
          type: integer
          format: int64
          description: Rate-limit window reset timestamp in milliseconds
        windowMs:
          type: integer

    RetryStatsResponse:
      type: object
      required: [operations]
      properties:
        operations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RetryStatistics"

    RetryStatistics:
      type: object
      required: [attempts, retries, succeeded, failed, totalDelayMs]
      properties:
        attempts:
          type: integer
        retries:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        totalDelayMs:
          type: integer

    CredentialImportItem:
      type: object
      required: [holderId, type, issuer, expiresAt]
      properties:
        holderId:
          type: string
          minLength: 1
        type:
          type: string
          enum: [identity, education, professional, financial]
        issuer:
          type: string
          minLength: 1
        expiresAt:
          type: integer
          format: int64
          description: Future Unix timestamp in seconds
        metadata:
          type: object
          additionalProperties: true

    CredentialImportBatch:
      type: object
      required: [importId, status, total, processed, imported, failed, progress, results]
      properties:
        importId:
          type: string
          format: uuid
        status:
          type: string
          enum: [in_progress, completed]
        total:
          type: integer
        processed:
          type: integer
        imported:
          type: integer
        failed:
          type: integer
        progress:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: integer
          format: int64
        completedAt:
          type: integer
          format: int64
        results:
          type: array
          items:
            type: object
            required: [row, status, errors]
            properties:
              row:
                type: integer
              status:
                type: string
                enum: [pending, imported, failed]
              credentialId:
                type: string
              errors:
                type: array
                items:
                  type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Server health status
      example:
        status: ok

    TokenRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          description: API key for authentication
        borrower:
          type: string
          description: Optional borrower address to embed in the JWT
      example:
        apiKey: "sk_test_1234567890abcdef"
        borrower: "GBXYZ..."

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Signed JWT token for subsequent API requests
      example:
        token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    ExpenseRequest:
      type: object
      required: [category, amount]
      properties:
        category:
          type: string
          enum: [business, education, healthcare, other]
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        description:
          type: string
        declaredPurpose:
          type: string

    Expense:
      type: object
      required: [id, loanId, category, amount, createdAt]
      properties:
        id:
          type: string
          description: Unique expense identifier
        loanId:
          type: string
          description: Associated loan identifier
        category:
          type: string
          enum: [business, education, healthcare, other]
          description: Expense category
        amount:
          type: number
          description: Amount in stroops
          minimum: 0
          exclusiveMinimum: true
        description:
          type: string
          description: Optional expense description
        declaredPurpose:
          type: string
          description: Optional declared purpose of expense
        createdAt:
          type: integer
          format: int64
          description: Creation timestamp (Unix epoch milliseconds)
      example:
        id: "exp_123456"
        loanId: "loan_789"
        category: "education"
        amount: 50000
        description: "Tuition payment"
        createdAt: 1696156800000

    ExpenseBreakdown:
      type: object
      additionalProperties:
        type: number
      description: Map of category → total amount
      example:
        business: 150000
        education: 500000
        healthcare: 75000
        other: 25000

    RecurringPaymentRequest:
      type: object
      required: [amount, frequencySeconds]
      properties:
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
        frequencySeconds:
          type: number
          minimum: 0
          exclusiveMinimum: true
        startDate:
          type: integer
          format: int64
          description: Unix epoch milliseconds; defaults to now

    RecurringPaymentSchedule:
      type: object
      required: [loanId, amount, frequencySeconds, startDate, active]
      properties:
        loanId:
          type: string
          description: Associated loan identifier
        amount:
          type: number
          description: Payment amount in stroops
        frequencySeconds:
          type: number
          description: Payment frequency in seconds
        startDate:
          type: integer
          format: int64
          description: Schedule start date (Unix epoch milliseconds)
        active:
          type: boolean
          description: Whether schedule is currently active
        successRateBps:
          type: integer
          description: Success rate in basis points (0–10000)
      example:
        loanId: "loan_123"
        amount: 100000
        frequencySeconds: 2592000
        startDate: 1696156800000
        active: true
        successRateBps: 9500

    TerminateResponse:
      type: object
      required: [loanId, active]
      properties:
        loanId:
          type: string
          description: Loan identifier
        active:
          type: boolean
          description: Whether loan is still active after termination
          example: false
      example:
        loanId: "loan_123"
        active: false

    RecurringPaymentResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: string

    RegisterWebhookRequest:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - loan.requested
              - loan.disbursed
              - loan.repaid
              - loan.defaulted
              - vouch.created
              - vouch.withdrawn
              - slash.executed
              - config.updated

    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean

    WebhookRegistration:
      type: object
      required: [id, url, events, secret]
      properties:
        id:
          type: string
          description: Webhook registration identifier
        url:
          type: string
          format: uri
          description: Webhook endpoint URL
        events:
          type: array
          items:
            type: string
            enum:
              - loan.requested
              - loan.disbursed
              - loan.repaid
              - loan.defaulted
              - vouch.created
              - vouch.withdrawn
              - slash.executed
              - config.updated
          description: Events to subscribe to
        secret:
          type: string
          description: Signing secret — only returned at registration time, used for HMAC validation
        message:
          type: string
          description: Optional message from server
      example:
        id: "wh_abc123def456"
        url: "https://example.com/webhook"
        events: ["loan.disbursed", "loan.repaid"]
        secret: "whsec_1234567890abcdef"

    WebhookSummary:
      type: object
      required: [id, url, events, enabled, createdAt]
      properties:
        id:
          type: string
          description: Webhook registration identifier
        url:
          type: string
          format: uri
          description: Webhook endpoint URL
        events:
          type: array
          items:
            type: string
          description: Subscribed events
        enabled:
          type: boolean
          description: Whether webhook is currently enabled
        createdAt:
          type: integer
          format: int64
          description: Registration creation timestamp (Unix epoch milliseconds)
      example:
        id: "wh_abc123def456"
        url: "https://example.com/webhook"
        events: ["loan.disbursed", "loan.repaid"]
        enabled: true
        createdAt: 1696156800000

    DeletedResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
          description: Whether resource was successfully deleted
      example:
        deleted: true

    TestWebhookRequest:
      type: object
      required: [event]
      properties:
        event:
          type: string
        data:
          type: object
          additionalProperties: true

    TestWebhookResponse:
      type: object
      required: [success, statusCode]
      properties:
        success:
          type: boolean
          description: Whether webhook delivery was successful
        statusCode:
          type: integer
          description: HTTP status code received from webhook endpoint
      example:
        success: true
        statusCode: 200

    WebhookReceiveResponse:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
          description: Whether webhook event was received and processed
      example:
        received: true

    WebhookDeliveryAttempt:
      type: object
      required: [webhookId, event, attemptedAt, statusCode, ok]
      properties:
        webhookId:
          type: string
          description: Webhook registration identifier
        event:
          type: string
          description: Event type that triggered delivery
        attemptedAt:
          type: integer
          format: int64
          description: Delivery attempt timestamp (Unix epoch milliseconds)
        statusCode:
          type: integer
          description: HTTP status code returned by webhook endpoint
        ok:
          type: boolean
          description: Whether delivery succeeded
        error:
          type: string
          description: Error message if delivery failed
      example:
        webhookId: "wh_abc123def456"
        event: "loan.disbursed"
        attemptedAt: 1696243200000
        statusCode: 200
        ok: true
        error: null

    WebhookDeliveryStats:
      type: object
      required: [webhookId, totalAttempts, successCount, failureCount, successRateBps]
      properties:
        webhookId:
          type: string
          description: Webhook registration identifier
        totalAttempts:
          type: integer
          description: Total delivery attempts
        successCount:
          type: integer
          description: Number of successful deliveries
        failureCount:
          type: integer
          description: Number of failed deliveries
        successRateBps:
          type: integer
          description: Success rate in basis points (0–10000)
      example:
        webhookId: "wh_abc123def456"
        totalAttempts: 150
        successCount: 147
        failureCount: 3
        successRateBps: 9800

    ForecastPayment:
      type: object
      required: [paymentNumber, dueDate, principalComponent, interestComponent, totalPayment, remainingBalance]
      properties:
        paymentNumber:
          type: integer
          description: Sequential payment number
        dueDate:
          type: integer
          format: int64
          description: Due date (Unix epoch milliseconds)
        principalComponent:
          type: number
          description: Principal portion of this payment
        interestComponent:
          type: number
          description: Interest portion of this payment
        totalPayment:
          type: number
          description: Total payment amount (principal + interest)
        remainingBalance:
          type: number
          description: Outstanding loan balance after this payment
      example:
        paymentNumber: 1
        dueDate: 1698748800000
        principalComponent: 83000
        interestComponent: 4167
        totalPayment: 87167
        remainingBalance: 917000

    LoanForecastResponse:
      type: object
      required: [loanId, principal, interestRateBps, termDays, totalPayments, schedule]
      properties:
        loanId:
          type: string
          description: Loan identifier
        principal:
          type: number
          description: Loan principal in stroops
        interestRateBps:
          type: number
          description: Interest rate in basis points
        termDays:
          type: number
          description: Loan term in days
        totalPayments:
          type: integer
          description: Total number of scheduled payments
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/ForecastPayment"
          description: Payment schedule details
        accuracy:
          type: object
          properties:
            meanErrorBps:
              type: number
              description: Mean forecasting error in basis points
            sampleCount:
              type: integer
              description: Number of historical samples
          description: Historical forecast accuracy metrics
      example:
        loanId: "loan_456"
        principal: 1000000
        interestRateBps: 500
        termDays: 365
        totalPayments: 12
        schedule:
          - paymentNumber: 1
            dueDate: 1698748800000
            principalComponent: 83000
            interestComponent: 4167
            totalPayment: 87167
            remainingBalance: 917000
        accuracy:
          meanErrorBps: 50
          sampleCount: 5

    RecordForecastAccuracyRequest:
      type: object
      required: [paymentNumber, forecastedAmount, actualAmount]
      properties:
        paymentNumber:
          type: integer
          minimum: 1
          description: Payment number to record accuracy for
        forecastedAmount:
          type: number
          minimum: 0
          description: Forecasted payment amount in stroops
        actualAmount:
          type: number
          minimum: 0
          description: Actual payment amount in stroops
      example:
        paymentNumber: 1
        forecastedAmount: 87167
        actualAmount: 87200

    ForecastAccuracyResponse:
      type: object
      required: [loanId, meanErrorBps, sampleCount]
      properties:
        loanId:
          type: string
          description: Loan identifier
        meanErrorBps:
          type: number
          description: Updated mean forecasting error in basis points
        sampleCount:
          type: integer
          description: Total number of accuracy samples
      example:
        loanId: "loan_456"
        meanErrorBps: 45
        sampleCount: 6
